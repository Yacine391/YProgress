<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- PWA : sans ces balises l'app n'est pas installable proprement sur iPhone. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#020A1A" />
    <meta name="description" content="Coach personnel nutrition, entraînement, récupération et progression." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="YProgress" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <!-- Manrope : grotesque humaniste proche de SF Pro, excellents chiffres. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        margin: 0;
        background-color: #020A1A;
        color-scheme: dark;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /*
       * Safe areas iOS : l'encoche et la barre d'accueil sont gérées ici.
       * React Native Web rend SafeAreaView comme une simple View, elle n'insère aucune marge.
       */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
      }
      /* Le défilement horizontal des jours ne doit pas déclencher le retour arrière du navigateur. */
      * {
        overscroll-behavior-x: contain;
      }
      /* Champs de saisie : 16px minimum, sinon iOS zoome automatiquement au focus. */
      input,
      textarea,
      select {
        font-size: 16px;
      }
      ::selection {
        background: #7A49E3;
        color: #ffffff;
      }
    </style>
  </head>

  <body>
    <noscript>Active JavaScript pour utiliser YProgress.</noscript>
    <div id="root"></div>
  </body>
</html>
